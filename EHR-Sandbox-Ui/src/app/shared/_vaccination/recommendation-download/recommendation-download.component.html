<mat-card>
  <mat-toolbar>
    Get Immunization Recommendations from CDSi / Registry
  </mat-toolbar>

  <mat-toolbar>
    <app-immunization-registry-menu></app-immunization-registry-menu>
    <span
      class="matbar-spacer"
      style="max-width: 300px; min-width: 400px"
    ></span>
    <button mat-raised-button type="button" (click)="fetch()">
      <mat-icon>download</mat-icon>
      Get Recommendations from IIS
    </button>
  </mat-toolbar>
  <mat-card-subtitle>
    <p>
      This functionality uses the
      <a href="https://hl7.org/fhir/us/immds/index.html">$immds-forecast</a>
      operation to get FHIR ImmunizationRecommendation Resources from a
      supporting server.
    </p>
  </mat-card-subtitle>
</mat-card>
