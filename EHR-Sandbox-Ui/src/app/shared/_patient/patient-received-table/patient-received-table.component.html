<div class="sticky-header">
  <div class="sticky-header-prefix">
    <span class="custom-title">Members</span>
    <!-- <button mat-icon-button style="margin-top: -7px; margin-bottom: -6px;" (click)="openCreation()" color="primary" [disabled]="!(facility && facility.id > 0)" matTooltip="New Patient">
      <mat-icon>add</mat-icon>
    </button> -->
  </div>
  <input (keyup)="applyFilter($event)" class="search-bar" placeholder="Search">
</div>
<!-- <mat-progress-bar mode="query" *ngIf="loading"></mat-progress-bar> -->
<table mat-table [dataSource]="dataSource" multiTemplateDataRows class="mat-elevation-z8" matSort>
  <ng-container matColumnDef="nameFirst">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> First name</th>
    <td mat-cell *matCellDef="let element">{{element.names[0].nameFirst}}</td>
  </ng-container>
  <ng-container matColumnDef="mrn">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Identifier</th>
    <td mat-cell *matCellDef="let element">{{extractMrn(element)}}</td>
  </ng-container>
  <ng-container matColumnDef="nameMiddle">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Middle name</th>
    <td mat-cell *matCellDef="let element">{{element.names[0].nameMiddle}}</td>
  </ng-container>
  <ng-container matColumnDef="nameLast">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Last name</th>
    <td mat-cell *matCellDef="let element">{{element.names[0].nameLast}}</td>
  </ng-container>
  <ng-container matColumnDef="birthDate">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Birth date</th>
    <td mat-cell *matCellDef="let element">{{element.birthDate | date: 'shortDate'}}</td>
  </ng-container>
  <ng-container matColumnDef="details">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Details</th>
    <td mat-cell *matCellDef="let element">
      <span *ngIf="element.id; else notMatched" style="display: flex; align-items: center;">
        <span>{{element.entity.display}}</span>
        <button mat-icon-button
                (click)="openPatient(element.id); $event.stopPropagation();"><mat-icon>open_in_new</mat-icon></button>
      </span>
      <ng-template #notMatched>
        No match in facility
      </ng-template>
    </td>
  </ng-container>
  <!-- <ng-container matColumnDef="system">
    <th mat-header-cell *matHeaderCellDef mat-sort-header> Identifier System </th>
    <td mat-cell *matCellDef="let element">{{element.entity.reference.identifier.system}}</td>
  </ng-container>   -->

  <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
  <ng-container matColumnDef="expandedDetail">
    <td mat-cell *matCellDef="let element; let i = dataIndex" [attr.colspan]="columns.length">
      <div class="element-detail" [@detailExpand]="selectedElementIndex == i? 'expanded' : 'collapsed'">
        <pre>{{element | json}}</pre>

      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let element; columns: columns;let i = dataIndex" class="element-row" (click)="onSelection(i)">
  </tr>
  <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"></tr>
</table>
<app-empty-list-message></app-empty-list-message>
