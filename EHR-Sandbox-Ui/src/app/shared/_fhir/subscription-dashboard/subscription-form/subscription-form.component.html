<form (submit)="subscribeToIIS()">
  <mat-card class="dashboard-card">
    <mat-card-content class="dashboard-card-content">
      <mat-card-title></mat-card-title>
      <app-card-form [baseForm]="SUBSCRIPTION_TOPIC_FORM" [model]="topic"
                     (modelChange)="topic = $event"></app-card-form>
      <div>
        <button mat-raised-button name="submit" type="submit" disabled="{{facilityService.getCurrentId() < 0}}">
          Subscribe to IIS
        </button>
        <p class="w3-red" *ngIf="facilityService.getCurrentId() < 0">No facility selected</p>
        <p class="w3-red" *ngIf="error">{{error}}</p>
        <mat-progress-bar *ngIf="loading" mode="query"></mat-progress-bar>
      </div>
    </mat-card-content>
  </mat-card>
</form>
