<div class="sticky-header">
  <span class="custom-title">Acknowledgements</span>
  <input (keyup)="applyFilter($event)" class="search-bar" placeholder="Search">
  <mat-progress-bar mode="query" *ngIf="loading"></mat-progress-bar>
</div>
<div class="table-container mat-elevation-z8">
  <div>
    <table mat-table [dataSource]="dataSource" multiTemplateDataRows class="mat-elevation-z8" matSort>
      <ng-container matColumnDef="messageId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Message id</th>
        <td mat-cell *matCellDef="let element">{{element.messageId}}</td>
      </ng-container>
      <ng-container matColumnDef="patient">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Patient</th>
        <td mat-cell *matCellDef="let element">{{element.patient | patientResume: ["full"]}}</td>
      </ng-container>
      <ng-container matColumnDef="msa_2">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let element">{{element.msa_2}}</td>
      </ng-container>
      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Timestamp</th>
        <td mat-cell *matCellDef="let element">{{element.timestamp | date: 'shortTime'}}</td>
      </ng-container>
      <ng-container matColumnDef="iis">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>IIS</th>
        <td mat-cell *matCellDef="let element">{{element.iis | registryName}}</td>
      </ng-container>
      <ng-container matColumnDef="senderId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Sender</th>
        <td mat-cell *matCellDef="let element">{{element.senderId}}</td>
      </ng-container>

      <ng-container matColumnDef="receiverId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Receiver</th>
        <td mat-cell *matCellDef="let element">{{element.receiverId}}</td>
      </ng-container>


      <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="columns.length">
          <app-ack-display [acknowledgementObject]="element"></app-ack-display>
        </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="columns;"></tr>
      <tr [ngClass]="rowClass(element)" mat-row *matRowDef="let element; columns: columns;" class="element-row"
          [class.expanded-row]="selectedElement === element" (click)="onSelection(element)">
      </tr>
      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"></tr>
    </table>
  </div>
  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>
