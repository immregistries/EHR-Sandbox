<button mat-icon-button *ngIf="element.feedbacksCount && element.feedbacksCount > 0" style="color: red;"
        matTooltip="Errors documented: {{element.feedbacksCount}}" matTooltipClass="example-tooltip-red"
        (click)="openFeedback(element); $event.stopPropagation();">
  <mat-icon [matBadge]="element.feedbacksCount" [matBadgeSize]="element.feedbacksCount < 100? 'small' : 'medium'"
            matBadgeOverlap="true" matBadgePosition="below">
    warning
  </mat-icon>
</button>
