<h2 mat-dialog-title>Bulk import merging menu</h2>
<div mat-dialog-content>
  <mat-tab-group>
    <mat-tab [label]="'Immunization history merging'">
      <mat-grid-list cols="2" [rowHeight]="'40vh'">
        <mat-grid-tile colspan="2">
          <mat-card class="dashboard-card">
            <mat-card-content class="dashboard-card-content">
              <app-patient-table (selectIndexEmitter)="patientIndexSelected($event)" [selectedElement]="selectedPatient"
                                 [dataArray]="ehrGroup.patientList ?? []" [allow_create]="false"
                                 title="Local Group Members"></app-patient-table>
            </mat-card-content>
          </mat-card>
        </mat-grid-tile>
        <!-- <mat-grid-tile>
          <mat-card class="dashboard-card">
            <mat-card-content class="dashboard-card-content">
              <app-patient-received-table title="Remote Group Members" [remotePatients]="remotePatients"
                [patientToCompare]="patientService.getCurrent()" [localPatients]="ehrGroup.patientList ?? []"
                (selectEmitter)="remotePatientSelected($event)"></app-patient-received-table>
            </mat-card-content>
          </mat-card>
        </mat-grid-tile> -->
        <mat-grid-tile>
          <mat-card class="dashboard-card">
            <mat-card-content class="dashboard-card-content">
              <app-vaccination-table [patientId]="selectedPatient?.id ?? -1" [allow_create]="false"
                                     (selectIndexEmitter)="selectVaccinationIndex($event)"
                                     [dataArray]="localVaccinations"></app-vaccination-table>
            </mat-card-content>
          </mat-card>
        </mat-grid-tile>
        <mat-grid-tile>
          <mat-card class="dashboard-card">
            <mat-card-content class="dashboard-card-content">
              <mat-progress-bar *ngIf="loading" [mode]="'query'"></mat-progress-bar>
              <app-vaccination-received-table [remoteValues]="remoteVaccinations" [patientId]="selectedPatient?.id"
                                              [localSelectedIndex]="selectedVaccinationIndex"
                                              [localValues]="localVaccinations"></app-vaccination-received-table>
            </mat-card-content>
          </mat-card>
        </mat-grid-tile>
      </mat-grid-list>
    </mat-tab>
    <mat-tab [label]="'Patient information merging'">
      <mat-grid-list cols="2" [rowHeight]="'40vh'">
        <mat-grid-tile>
          <mat-card class="dashboard-card">
            <mat-card-content class="dashboard-card-content">

              <app-patient-table (selectEmitter)="patientSelected($event)" [dataArray]="ehrGroup.patientList ?? []"
                                 [selectedElement]="selectedPatient" [allow_create]="false"
                                 title="Local Group Members"></app-patient-table>
            </mat-card-content>
          </mat-card>
        </mat-grid-tile>
        <mat-grid-tile>
          <mat-card class="dashboard-card">
            <mat-card-content class="dashboard-card-content">
              <app-patient-received-table title="Remote Group Members" [remoteValues]="remotePatients"
                                          [localSelectedIndex]="selectedPatientIndex"
                                          [localValues]="ehrGroup.patientList ?? []"
                                          (selectEmitter)="remotePatientSelected($event)"></app-patient-received-table>
            </mat-card-content>
          </mat-card>
        </mat-grid-tile>
      </mat-grid-list>
    </mat-tab>
  </mat-tab-group>

</div>
